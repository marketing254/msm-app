<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 260px; font: 13px/1.5 "Segoe UI", system-ui, Arial, sans-serif; color: #1E2733; }
  div { padding: 12px 14px; }
  b { color: #1F3A5F; }
  button { display: block; width: 100%; margin-top: 8px; background: #1F3A5F; color: #fff; border: 0; border-radius: 6px; padding: 8px; font: inherit; cursor: pointer; }
  button.quiet { background: #fff; color: #1F3A5F; border: 1px solid #DDE1E7; }
</style>
</head>
<body>
<div>
  <b>MSM Rank Helper</b>
  <p id="state" style="margin: 6px 0 0; color: #6B7A8C;">Checking...</p>
  <button id="open">Open status tab</button>
  <button id="settings" class="quiet">Settings</button>
</div>
<script src="popup.js"></script>
</body>
</html>
