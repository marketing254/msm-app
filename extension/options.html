<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MSM Rank Helper settings</title>
<style>
  body { margin: 0; font: 14px/1.5 "Segoe UI", system-ui, Arial, sans-serif; color: #1E2733; background: #F5F7FA; }
  main { max-width: 560px; margin: 30px auto; background: #fff; border: 1px solid #DDE1E7; border-radius: 8px; padding: 20px 24px; }
  h1 { font-size: 18px; color: #1F3A5F; margin: 0 0 4px; }
  .note { color: #6B7A8C; font-size: 13px; }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #DDE1E7; border-radius: 6px; font: inherit; }
  button { background: #1F3A5F; color: #fff; border: 0; border-radius: 6px; padding: 9px 14px; font: inherit; cursor: pointer; margin-top: 16px; }
  #msg { margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>MSM Rank Helper</h1>
  <div class="note">Enter these once. Ask Fathima for the two values.</div>
  <label for="appUrl">MSM Studio address</label>
  <input id="appUrl" placeholder="https://msm-app-sigma.vercel.app">
  <label for="token">Worker token</label>
  <input id="token" placeholder="the WORKER_TOKEN value" autocomplete="off">
  <label for="machine">This computer's name (shown on the Settings page)</label>
  <input id="machine" placeholder="Dulmini laptop">
  <button id="save">Save and start</button>
  <div id="msg"></div>
</main>
<script src="options.js"></script>
</body>
</html>
